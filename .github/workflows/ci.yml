name: PTE Adapter for Model Explorer CI

on:
  push:
    branches: ["main"]
    tags:
      - "v*.*.*"
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  DEFAULT_PY_VERSION: "3.10"

permissions:
  contents: read

jobs:
  discover-adapters:
    name: Discover published adapter versions
    runs-on: ${{ vars.LINUX_RUNNER }}
    env:
      PIP_INDEX_URL: ${{ secrets.INTERNAL_PYPI_AUTH_INDEX_URL || 'https://pypi.org/simple' }}
    outputs:
      vgf-versions: ${{ steps.vgf.outputs.versions }}
      latest-vgf-version: ${{ steps.vgf.outputs.latest-version }}
      tosa-versions: ${{ steps.tosa.outputs.versions }}
      latest-tosa-version: ${{ steps.tosa.outputs.latest-version }}
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Checkout plugin repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install discovery tools
        shell: bash
        run: |
          python -m pip install --upgrade "pip>=25.2" packaging

      - name: Discover VGF versions
        id: vgf
        shell: bash
        run: |
          python -m pip index versions vgf-adapter-model-explorer \
            --json --no-cache-dir --python-version "$DEFAULT_PY_VERSION" | \
            python scripts/discover-adapter-versions.py vgf-adapter-model-explorer

      - name: Discover TOSA versions
        id: tosa
        shell: bash
        run: |
          python -m pip index versions tosa-adapter-model-explorer \
            --json --no-cache-dir --python-version "$DEFAULT_PY_VERSION" | \
            python scripts/discover-adapter-versions.py tosa-adapter-model-explorer

  tests:
    name: Run tests (Python ${{ matrix.python-version }}, VGF ${{ matrix.vgf-version }}, TOSA ${{ matrix.tosa-version }}, ${{ matrix.runner }})
    needs: discover-adapters
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        runner: ${{ fromJSON(vars.TEST_RUNNERS) }}
        vgf-version: ${{ fromJSON(needs.discover-adapters.outputs.vgf-versions) }}
        tosa-version: ${{ fromJSON(needs.discover-adapters.outputs.tosa-versions) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Checkout plugin repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up virtual environment
        shell: bash
        env:
          PIP_INDEX_URL: ${{ secrets.INTERNAL_PYPI_AUTH_INDEX_URL || 'https://pypi.org/simple' }}
          VGF_VERSION: ${{ matrix.vgf-version }}
          TOSA_VERSION: ${{ matrix.tosa-version }}
        run: |
          # Keep adapter installations separate for each matrix job.
          VENV_DIR=$(python -c "import os, tempfile; print(tempfile.mkdtemp(prefix='pte-tests-', dir=os.environ['RUNNER_TEMP']))")
          python -m venv "$VENV_DIR"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            VENV_BIN="$VENV_DIR/Scripts"
            VENV_PYTHON="$VENV_BIN/python.exe"
          else
            VENV_BIN="$VENV_DIR/bin"
            VENV_PYTHON="$VENV_BIN/python"
          fi
          printf '%s\n' "$VENV_BIN" >> "$GITHUB_PATH"
          "$VENV_PYTHON" -m pip install --upgrade "pip>=25.2"
          "$VENV_PYTHON" -m pip install --upgrade . --group dev \
            "vgf-adapter-model-explorer==$VGF_VERSION" \
            "tosa-adapter-model-explorer==$TOSA_VERSION"
          "$VENV_PYTHON" -m pip check
          "$VENV_PYTHON" -m pip show vgf-adapter-model-explorer tosa-adapter-model-explorer
          "$VENV_PYTHON" -c "from vgf_adapter_model_explorer.main import VGFAdapter; from tosa_adapter_model_explorer.main import TosaFlatbufferAdapter"

      - name: Lint and Format Check
        run: |
          ruff check --output-format=github
          ruff format --check

      - name: Type Check
        run: |
          pyright

      - name: Run Tests
        shell: bash
        env:
          PIP_INDEX_URL: ${{ secrets.INTERNAL_PYPI_AUTH_INDEX_URL || 'https://pypi.org/simple' }}
          MATRIX_RUNNER: ${{ matrix.runner }}
          LINUX_RUNNER: ${{ vars.LINUX_RUNNER }}
          MATRIX_PYTHON_VERSION: ${{ matrix.python-version }}
          MATRIX_VGF_VERSION: ${{ matrix.vgf-version }}
          LATEST_VGF_VERSION: ${{ needs.discover-adapters.outputs.latest-vgf-version }}
          MATRIX_TOSA_VERSION: ${{ matrix.tosa-version }}
          LATEST_TOSA_VERSION: ${{ needs.discover-adapters.outputs.latest-tosa-version }}
          DEFAULT_PY_VERSION: ${{ env.DEFAULT_PY_VERSION }}
        run: |
          PYTEST_CVG_FLAGS=""
          if [[ "$MATRIX_RUNNER" == "$LINUX_RUNNER" && \
              "$MATRIX_PYTHON_VERSION" == "$DEFAULT_PY_VERSION" && \
              "$MATRIX_VGF_VERSION" == "$LATEST_VGF_VERSION" && \
              "$MATRIX_TOSA_VERSION" == "$LATEST_TOSA_VERSION" ]]; then
            python -m pip install --group coverage
            PYTEST_CVG_FLAGS="-v --cov=pte_adapter_model_explorer --cov-report=lcov:reports/lcov.info"
          fi
          python -m pytest --tb=short ${PYTEST_CVG_FLAGS}

      - name: Upload coverage to Qlty
        if: matrix.runner == vars.LINUX_RUNNER && matrix.python-version == env.DEFAULT_PY_VERSION && matrix.vgf-version == needs.discover-adapters.outputs.latest-vgf-version && matrix.tosa-version == needs.discover-adapters.outputs.latest-tosa-version
        uses: qltysh/qlty-action/coverage@9e8e09dfc3d82a968f4034f5265eaf3c142881f7 # v2.0.0
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: reports/lcov.info

  build:
    name: Build and Publish Wheels
    needs: [tests]
    runs-on: ${{ vars.LINUX_RUNNER }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-wheel
        env:
          PIP_INDEX_URL: ${{ secrets.INTERNAL_PYPI_AUTH_INDEX_URL || 'https://pypi.org/simple' }}
        with:
          python-version: ${{ env.DEFAULT_PY_VERSION }}
          internal-dev-version: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository_owner != 'arm' }}

      - name: Create SBOM output directory
        run: mkdir -p sbom

      - name: Generate wheel SBOM
        env:
          PIP_INDEX_URL: ${{ secrets.INTERNAL_PYPI_AUTH_INDEX_URL || 'https://pypi.org/simple' }}
        run: |
          python -m pip install --index-url https://pypi.org/simple cyclonedx-bom==7.3.0
          python -m venv .sbom-venv
          .sbom-venv/bin/python -m pip install --upgrade pip
          .sbom-venv/bin/python -m pip install dist/*.whl
          python -m cyclonedx_py environment .sbom-venv/bin/python \
            --output-format JSON \
            --output-file sbom/pte-adapter-model-explorer-wheel.cdx.json

      - name: Add SBOM disclaimer
        run: |
          python scripts/add-sbom-disclaimer.py \
            sbom/pte-adapter-model-explorer-wheel.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: project-sbom
          path: sbom/*.json
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/') && github.repository_owner == 'arm'
    needs:
      - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pte-adapter-model-explorer
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: getsentry/action-github-app-token@d4b5da6c5e37703f8c3b3e43abb5705b46e159cc #v3.0.0
        id: get_app_token
        with:
          app_id: ${{ secrets.ME_REPO_ACCESS_APP_ID }}
          private_key: ${{ secrets.ME_REPO_ACCESS_PRIVATE_KEY }}

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          token: ${{ steps.get_app_token.outputs.token }}
          persist-credentials: false

      - name: Generate release notes
        uses: orhun/git-cliff-action@d77b37db2e3f7398432d34b72a12aa3e2ba87e51 # v4.6.0
        id: git-cliff
        with:
          config: cliff.toml
          args: --latest
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}

      - name: Download distribution artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

      - name: Download project SBOM
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: project-sbom
          path: sbom/

      - name: Publish GitHub release
        uses: softprops/action-gh-release@5be0e66d93ac7ed76da52eca8bb058f665c3a5fe # v2.4.2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: |
            dist/*.whl
            sbom/*.json
          token: ${{ steps.get_app_token.outputs.token }}

  notify-umbrella:
    name: Request umbrella dependency update
    needs: release-internal
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && github.repository == 'Arm-Debug/pte-adapter-model-explorer'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Create internal umbrella token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.ME_REPO_ACCESS_APP_ID }}
          private-key: ${{ secrets.ME_REPO_ACCESS_PRIVATE_KEY }}
          owner: Arm-Debug
          repositories: executorch-extension-model-explorer
          permission-contents: write
        id: umbrella_token

      - name: Notify umbrella after internal release
        env:
          GH_TOKEN: ${{ steps.umbrella_token.outputs.token }}
          DEPENDENCY: ${{ github.event.repository.name }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh api --method POST \
            repos/Arm-Debug/executorch-extension-model-explorer/dispatches \
            -f event_type=update-dependency \
            -f "client_payload[dependency]=$DEPENDENCY" \
            -f "client_payload[version]=$RELEASE_TAG"

  release-internal:
    name: Release to internal PyPI
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && github.repository_owner != 'arm'
    needs:
      - build
    runs-on: ${{ vars.LINUX_RUNNER }}
    permissions: {}

    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.DEFAULT_PY_VERSION }}

      - name: Download distribution artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/

      - name: Publish distribution to internal PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: ${{ vars.INTERNAL_PYPI_UPLOAD_URL }}
          user: ${{ secrets.INTERNAL_PYPI_USERNAME }}
          password: ${{ secrets.INTERNAL_PYPI_TOKEN }}
          packages-dir: dist/
          attestations: false

  sync-commits-to-public-repo:
    name: Sync commits to public repo
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository_owner != 'arm'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Checkout target repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: arm/pte-adapter-model-explorer
          token: ${{ secrets.ARM_ORG_TOKEN }}
          path: target-repo
          persist-credentials: true
      - name: Push commits to public repo
        env:
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          cd target-repo
          git remote add source "$SOURCE_URL"
          git fetch source main
          git checkout main
          git merge source/main
          git push origin main
