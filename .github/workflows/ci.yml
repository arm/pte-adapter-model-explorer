name: PTE Adapter for Model Explorer CI

on:
  push:
    branches: ["main"]
    tags:
      - "v*.*.*"
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  DEFAULT_PY_VERSION: "3.10"

permissions:
  contents: read

jobs:
  discover-adapters:
    name: Discover latest compatible adapter versions
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || vars.LINUX_RUNNER }}
    env:
      PYTHON_VERSIONS_JSON: '["3.10", "3.11", "3.12", "3.13", "3.14"]'
      TEST_RUNNERS_JSON: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '["ubuntu-latest"]' || vars.TEST_RUNNERS }}
      LINUX_RUNNER_JSON: ${{ toJSON(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || vars.LINUX_RUNNER) }}
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Import internal credentials from Vault
        id: vault
        if: ${{ github.repository_owner == 'Arm-Debug' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && github.actor != 'dependabot[bot]' }}
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4
        with:
          url: ${{ secrets.VAULT_URL }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          namespace: ${{ vars.VAULT_NAMESPACE }}
          exportEnv: false
          secrets: |
            kv/data/MLIA/CI?version=${{ vars.VAULT_CI_SECRET_VERSION || '0' }} UV_DEFAULT_INDEX | UV_DEFAULT_INDEX ;
            kv/data/MLIA/CI?version=${{ vars.VAULT_CI_SECRET_VERSION || '0' }} INTERNAL_PYPI_USERNAME | UV_INDEX_INTERNAL_USERNAME ;
            kv/data/MLIA/CI?version=${{ vars.VAULT_CI_SECRET_VERSION || '0' }} INTERNAL_PYPI_PASSWORD | UV_INDEX_INTERNAL_PASSWORD

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Checkout plugin repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: false

      - name: Build latest-compatible test matrix
        id: matrix
        env:
          UV_DEFAULT_INDEX: ${{ steps.vault.outputs.UV_DEFAULT_INDEX || 'https://pypi.org/simple' }}
          UV_INDEX_INTERNAL_USERNAME: ${{ steps.vault.outputs.UV_INDEX_INTERNAL_USERNAME }}
          UV_INDEX_INTERNAL_PASSWORD: ${{ steps.vault.outputs.UV_INDEX_INTERNAL_PASSWORD }}
        shell: bash
        run: python scripts/discover-adapter-versions.py

  tests:
    name: Run tests (Python ${{ matrix.python-version }}, VGF ${{ matrix.vgf-version }}, TOSA ${{ matrix.tosa-version }}, ${{ matrix.runner }})
    needs: discover-adapters
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover-adapters.outputs.matrix) }}
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || matrix.runner }}
    env:
      UV_PRERELEASE: allow
    steps:
      - name: Import internal credentials from Vault
        id: vault
        if: ${{ github.repository_owner == 'Arm-Debug' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && github.actor != 'dependabot[bot]' }}
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4
        with:
          url: ${{ secrets.VAULT_URL }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          namespace: ${{ vars.VAULT_NAMESPACE }}
          exportEnv: false
          secrets: |
            kv/data/MLIA/CI?version=${{ vars.VAULT_CI_SECRET_VERSION || '0' }} UV_DEFAULT_INDEX | UV_DEFAULT_INDEX ;
            kv/data/MLIA/CI?version=${{ vars.VAULT_CI_SECRET_VERSION || '0' }} INTERNAL_PYPI_USERNAME | UV_INDEX_INTERNAL_USERNAME ;
            kv/data/MLIA/CI?version=${{ vars.VAULT_CI_SECRET_VERSION || '0' }} INTERNAL_PYPI_PASSWORD | UV_INDEX_INTERNAL_PASSWORD

      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: false

      - name: Verify compatible adapters exist
        if: ${{ !matrix.available }}
        shell: bash
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
          VGF_VERSION: ${{ matrix.vgf-version }}
          TOSA_VERSION: ${{ matrix.tosa-version }}
        run: |
          echo "::error::No compatible adapter versions for Python $PYTHON_VERSION (VGF: $VGF_VERSION, TOSA: $TOSA_VERSION)"
          exit 1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: ${{ matrix.available }}
        with:
          python-version: ${{ matrix.python-version }}

      - name: Checkout plugin repo
        if: ${{ matrix.available }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up virtual environment
        if: ${{ matrix.available }}
        shell: bash
        env:
          UV_DEFAULT_INDEX: ${{ steps.vault.outputs.UV_DEFAULT_INDEX || 'https://pypi.org/simple' }}
          UV_INDEX_INTERNAL_USERNAME: ${{ steps.vault.outputs.UV_INDEX_INTERNAL_USERNAME }}
          UV_INDEX_INTERNAL_PASSWORD: ${{ steps.vault.outputs.UV_INDEX_INTERNAL_PASSWORD }}
          VGF_VERSION: ${{ matrix.vgf-version }}
          TOSA_VERSION: ${{ matrix.tosa-version }}
        run: |
          # Keep adapter installations separate for each matrix job.
          VENV_DIR=$(python -c "import os, tempfile; print(tempfile.mkdtemp(prefix='pte-tests-', dir=os.environ['RUNNER_TEMP']))")
          python -m venv "$VENV_DIR"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            VENV_BIN="$VENV_DIR/Scripts"
            VENV_PYTHON="$VENV_BIN/python.exe"
          else
            VENV_BIN="$VENV_DIR/bin"
            VENV_PYTHON="$VENV_BIN/python"
          fi
          printf '%s\n' "$VENV_BIN" >> "$GITHUB_PATH"
          uv pip install --python "$VENV_PYTHON" --only-binary spirv-adapter-model-explorer --upgrade . --group dev \
            "vgf-adapter-model-explorer==$VGF_VERSION" \
            "tosa-adapter-model-explorer==$TOSA_VERSION"
          uv pip check --python "$VENV_PYTHON"
          uv pip show --python "$VENV_PYTHON" vgf-adapter-model-explorer tosa-adapter-model-explorer
          "$VENV_PYTHON" -c "from vgf_adapter_model_explorer.main import VGFAdapter; from tosa_adapter_model_explorer.main import TosaFlatbufferAdapter"

      - name: Lint and Format Check
        if: ${{ matrix.available }}
        run: |
          ruff check --output-format=github
          ruff format --check

      - name: Type Check
        if: ${{ matrix.available }}
        run: |
          pyright

      - name: Install coverage tools
        if: ${{ matrix.available && matrix.coverage }}
        shell: bash
        env:
          UV_DEFAULT_INDEX: ${{ steps.vault.outputs.UV_DEFAULT_INDEX || 'https://pypi.org/simple' }}
          UV_INDEX_INTERNAL_USERNAME: ${{ steps.vault.outputs.UV_INDEX_INTERNAL_USERNAME }}
          UV_INDEX_INTERNAL_PASSWORD: ${{ steps.vault.outputs.UV_INDEX_INTERNAL_PASSWORD }}
        run: uv pip install --python "$(python -c 'import sys; print(sys.executable)')" --group coverage

      - name: Run Tests
        if: ${{ matrix.available }}
        shell: bash
        env:
          GENERATE_COVERAGE: ${{ matrix.coverage }}
        run: |
          PYTEST_CVG_FLAGS=()
          if [[ "$GENERATE_COVERAGE" == "true" ]]; then
            PYTEST_CVG_FLAGS=(-v --cov=pte_adapter_model_explorer --cov-report=lcov:reports/lcov.info)
          fi
          python -m pytest --tb=short "${PYTEST_CVG_FLAGS[@]}"

      - name: Upload coverage to Qlty
        if: ${{ matrix.available && matrix.coverage }}
        uses: qltysh/qlty-action/coverage@9e8e09dfc3d82a968f4034f5265eaf3c142881f7 # v2.0.0
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: reports/lcov.info

  build:
    name: Build and Publish Wheels
    needs: [tests]
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || vars.LINUX_RUNNER }}
    steps:
      - name: Import internal credentials from Vault
        id: vault
        if: ${{ github.repository_owner == 'Arm-Debug' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && github.actor != 'dependabot[bot]' }}
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4
        with:
          url: ${{ secrets.VAULT_URL }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          namespace: ${{ vars.VAULT_NAMESPACE }}
          exportEnv: false
          secrets: |
            kv/data/MLIA/CI?version=${{ vars.VAULT_CI_SECRET_VERSION || '0' }} UV_DEFAULT_INDEX | UV_DEFAULT_INDEX ;
            kv/data/MLIA/CI?version=${{ vars.VAULT_CI_SECRET_VERSION || '0' }} INTERNAL_PYPI_USERNAME | UV_INDEX_INTERNAL_USERNAME ;
            kv/data/MLIA/CI?version=${{ vars.VAULT_CI_SECRET_VERSION || '0' }} INTERNAL_PYPI_PASSWORD | UV_INDEX_INTERNAL_PASSWORD

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/build-wheel
        env:
          UV_DEFAULT_INDEX: ${{ steps.vault.outputs.UV_DEFAULT_INDEX || 'https://pypi.org/simple' }}
          UV_INDEX_INTERNAL_USERNAME: ${{ steps.vault.outputs.UV_INDEX_INTERNAL_USERNAME }}
          UV_INDEX_INTERNAL_PASSWORD: ${{ steps.vault.outputs.UV_INDEX_INTERNAL_PASSWORD }}
        with:
          python-version: ${{ env.DEFAULT_PY_VERSION }}

      - name: Create SBOM output directory
        run: mkdir -p sbom

      - name: Generate wheel SBOM
        env:
          UV_DEFAULT_INDEX: ${{ steps.vault.outputs.UV_DEFAULT_INDEX || 'https://pypi.org/simple' }}
          UV_INDEX_INTERNAL_USERNAME: ${{ steps.vault.outputs.UV_INDEX_INTERNAL_USERNAME }}
          UV_INDEX_INTERNAL_PASSWORD: ${{ steps.vault.outputs.UV_INDEX_INTERNAL_PASSWORD }}
        run: |
          uv pip install --system --default-index https://pypi.org/simple cyclonedx-bom==7.3.0
          python -m venv --clear .sbom-venv
          uv pip install --python .sbom-venv/bin/python --prerelease allow --only-binary spirv-adapter-model-explorer dist/*.whl
          python -m cyclonedx_py environment .sbom-venv/bin/python \
            --output-format JSON \
            --output-file sbom/pte-adapter-model-explorer-wheel.cdx.json

      - name: Add SBOM disclaimer
        run: |
          python scripts/add-sbom-disclaimer.py \
            sbom/pte-adapter-model-explorer-wheel.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: project-sbom
          path: sbom/*.json
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/') && github.repository_owner == 'arm'
    needs:
      - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pte-adapter-model-explorer
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          token: ${{ github.token }}
          persist-credentials: false

      - name: Generate release notes
        uses: orhun/git-cliff-action@d77b37db2e3f7398432d34b72a12aa3e2ba87e51 # v4.6.0
        id: git-cliff
        with:
          config: cliff.toml
          args: --latest
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}

      - name: Download distribution artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

      - name: Download project SBOM
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: project-sbom
          path: sbom/

      - name: Publish GitHub release
        uses: softprops/action-gh-release@5be0e66d93ac7ed76da52eca8bb058f665c3a5fe # v2.4.2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: |
            dist/*.whl
            sbom/*.json
          token: ${{ github.token }}

  notify-umbrella:
    name: Request umbrella dependency update
    needs: release-internal
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && github.repository == 'Arm-Debug/pte-adapter-model-explorer'
    runs-on: ${{ vars.LINUX_RUNNER || 'self-hosted-ubuntu-latest' }}
    permissions: {}
    steps:
      - name: Check for a clean release tag
        id: release_tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if [[ "$RELEASE_TAG" =~ ^v[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
            echo "clean=true" >> "$GITHUB_OUTPUT"
          else
            echo "clean=false" >> "$GITHUB_OUTPUT"
            echo "Skipping umbrella update: not a clean release tag."
          fi

      - name: Import internal credentials from Vault
        id: vault
        if: steps.release_tag.outputs.clean == 'true'
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4
        with:
          url: ${{ secrets.VAULT_URL }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          namespace: ${{ vars.VAULT_NAMESPACE }}
          exportEnv: false
          secrets: |
            kv/data/MLIA/CI?version=${{ vars.VAULT_CI_SECRET_VERSION || '0' }} ME_REPO_ACCESS_APP_ID | ME_REPO_ACCESS_APP_ID ;
            kv/data/MLIA/CI?version=${{ vars.VAULT_CI_SECRET_VERSION || '0' }} ME_REPO_ACCESS_PRIVATE_KEY | ME_REPO_ACCESS_PRIVATE_KEY

      - name: Create internal umbrella token
        if: steps.release_tag.outputs.clean == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ steps.vault.outputs.ME_REPO_ACCESS_APP_ID }}
          private-key: ${{ steps.vault.outputs.ME_REPO_ACCESS_PRIVATE_KEY }}
          owner: Arm-Debug
          repositories: executorch-extension-model-explorer
          permission-contents: write
        id: umbrella_token

      - name: Notify umbrella after internal release
        if: steps.release_tag.outputs.clean == 'true'
        env:
          GH_TOKEN: ${{ steps.umbrella_token.outputs.token }}
          DEPENDENCY: ${{ github.event.repository.name }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh api --method POST \
            repos/Arm-Debug/executorch-extension-model-explorer/dispatches \
            -f event_type=update-dependency \
            -f "client_payload[dependency]=$DEPENDENCY" \
            -f "client_payload[version]=$RELEASE_TAG"

  release-internal:
    name: Release to internal PyPI
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && github.repository == 'Arm-Debug/pte-adapter-model-explorer'
    needs:
      - build
    runs-on: ${{ vars.LINUX_RUNNER }}
    permissions: {}

    steps:
      - name: Import internal credentials from Vault
        id: vault
        if: ${{ github.repository_owner == 'Arm-Debug' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && github.actor != 'dependabot[bot]' }}
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4
        with:
          url: ${{ secrets.VAULT_URL }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          namespace: ${{ vars.VAULT_NAMESPACE }}
          exportEnv: false
          secrets: |
            kv/data/MLIA/CI?version=${{ vars.VAULT_CI_SECRET_VERSION || '0' }} PUBLISH_PYPI_HOST | PUBLISH_PYPI_HOST ;
            kv/data/MLIA/CI?version=${{ vars.VAULT_CI_SECRET_VERSION || '0' }} PUBLISH_PYPI_USERNAME | PUBLISH_PYPI_USERNAME ;
            kv/data/MLIA/CI?version=${{ vars.VAULT_CI_SECRET_VERSION || '0' }} PUBLISH_PYPI_PASSWORD | PUBLISH_PYPI_PASSWORD

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.DEFAULT_PY_VERSION }}

      - name: Download distribution artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/

      - name: Check internal publishing configuration
        shell: bash
        env:
          UPLOAD_URL: ${{ steps.vault.outputs.PUBLISH_PYPI_HOST }}
        run: |
          if [[ -z "$UPLOAD_URL" ]]; then
            echo "Set PUBLISH_PYPI_HOST in Vault before publishing to Artifactory." >&2
            exit 1
          fi

      - name: Publish distribution to internal PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: ${{ steps.vault.outputs.PUBLISH_PYPI_HOST }}
          user: ${{ steps.vault.outputs.PUBLISH_PYPI_USERNAME }}
          password: ${{ steps.vault.outputs.PUBLISH_PYPI_PASSWORD }}
          packages-dir: dist/
          attestations: false

  sync-commits-to-public-repo:
    name: Sync commits to public repo
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Arm-Debug/pte-adapter-model-explorer'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Checkout target repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: arm/pte-adapter-model-explorer
          token: ${{ secrets.ARM_ORG_TOKEN }}
          path: target-repo
          persist-credentials: true
      - name: Push commits to public repo
        env:
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          cd target-repo
          git remote add source "$SOURCE_URL"
          git fetch source main
          git checkout main
          git merge source/main
          git push origin main
