name: Build wheel (composite)
description: Builds wheels for PTE Adapter for Model Explorer

inputs:
  python-version:
    required: true
  internal-dev-version:
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Set up Python environment
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ inputs.python-version }}

    - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
      with:
        enable-cache: false

    - name: Set internal development version
      if: inputs.internal-dev-version == 'true'
      shell: bash
      run: |
        BASE_VERSION=$(git describe --tags --abbrev=0 | sed 's/^v//')
        SHORT_SHA="${GITHUB_SHA::7}"

        IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"
        NEXT_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"

        DEV_VERSION="${NEXT_VERSION}.dev${GITHUB_RUN_NUMBER}+${SHORT_SHA}"

        echo "Building internal development version ${DEV_VERSION} from ${GITHUB_SHA}"
        echo "SETUPTOOLS_SCM_PRETEND_VERSION_FOR_SPIRV_ADAPTER_MODEL_EXPLORER=${DEV_VERSION}" >> "$GITHUB_ENV"

    - name: Build plugin package
      shell: bash
      env:
        BUILD_PYTHON_VERSION: ${{ inputs.python-version }}
      run: uv build --python "$BUILD_PYTHON_VERSION"

    - name: Upload plugin package artifact
      uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
      with:
        name: dist
        path: dist
